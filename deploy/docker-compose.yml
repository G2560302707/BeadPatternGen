# BeadPatternGen · docker compose
#
# 用法（在仓库根目录）：
#   docker compose -f deploy/docker-compose.yml up -d --build
#   curl -I http://127.0.0.1:8080/
#
# 对外暴露 8080；生产环境请在前面加 HTTPS 反向代理（Caddy / Traefik /
# 云负载均衡），并确保代理不剥离 COOP/COEP 响应头。

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # false = 不在构建时下载模型，镜像更小；此时取消下面 volumes 的注释，
        # 把本机 public/models 挂进容器，否则“主体识别”会报模型下载失败。
        DOWNLOAD_MODELS: "true"
    image: bead-pattern-gen:0.2.0
    ports:
      - "8080:80"
    restart: unless-stopped
    # volumes:
    #   - ../public/models:/var/www/bead/models:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
