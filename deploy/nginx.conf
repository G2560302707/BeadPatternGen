# BeadPatternGen · nginx 站点配置
#
# 放置：/etc/nginx/conf.d/bead.conf
# 前置：把构建产物 dist/ 同步到 /var/www/bead/（目录内应有 index.html、assets/、
#       models/、ort/、fonts/），然后 nginx -t && nginx -s reload。
#
# 关键点：
#   1. COOP/COEP 让页面进入 crossOriginIsolated，onnxruntime-web 才能用多线程 WASM；
#   2. /models/ 与 /ort/ 必须返回真实 404，不能被 SPA 回退成 index.html；
#   3. .mjs / .wasm 的 MIME 必须正确，否则 ORT 动态导入或实例化失败。

server {
    listen 80;
    # 主机/容器禁用 IPv6 时删除这一行，否则 nginx 可能启动失败。
    listen [::]:80;
    server_name _;

    root /var/www/bead;
    index index.html;

    charset utf-8;
    server_tokens off;
    sendfile on;
    tcp_nopush on;

    # ── 必需：跨源隔离 ────────────────────────────────────────────────
    # 缺失时应用仍能运行，但分割会退回单线程 WASM（首次识别明显更慢）。
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ── 压缩 ─────────────────────────────────────────────────────────
    # 只压文本类；models/*.onnx 是稠密二进制，压缩几乎无收益且浪费 CPU。
    # 28 MB 的 ort wasm 在线 gzip 会持续占用 CPU：高流量站点建议改用
    # brotli_static / gzip_static 预压缩，或从 gzip_types 中移除 application/wasm。
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        text/javascript
        application/json
        image/svg+xml
        application/wasm;

    # 注意：nginx 的 add_header 在同一层级再次出现时，会覆盖从上层继承的
    # add_header。下面的 location 里重复写了 nosniff，但不再重复 COOP/COEP：
    # 这两个头只对 HTML 文档有意义，静态子资源不需要。

    # 带内容哈希的构建产物：一年强缓存。^~ 防止被下面的扩展名正则抢走。
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 分割模型：内容固定，长缓存；缺失时必须 404，不能回退到 index.html。
    location /models/ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # onnxruntime wasm 运行时：文件名不随内容哈希，30 天缓存。
    location /ort/ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 字体 / 示例图。
    location ~* \.(?:woff2|ttf|png|jpe?g|webp|svg)$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 部分发行版的 mime.types 没有 .wasm / .mjs。default_type 只在扩展名
    # 未映射时生效，所以不会改坏已经正确映射的服务器。
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.mjs$ {
        default_type text/javascript;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 应用入口。HashRouter 不需要 history 回退；这里的回退只保证直接访问
    # 未知路径时仍能打开应用。index.html 不缓存，发布后立即生效。
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # 不暴露隐藏文件（保留 ACME 验证目录）。
    location ~ /\.(?!well-known) {
        deny all;
    }
}

# ── 子路径部署（例如 https://example.com/bead/）──────────────────────
# 1) 构建前在 vite.config.ts 里设置 base: "/bead/"（或构建时传 --base）；
# 2) 把 dist/ 放到 /var/www/bead/，并把 server 的 root 改为 /var/www；
# 3) 把上面的 location / 改成：
#
#    location /bead/ {
#        expires -1;
#        try_files $uri $uri/ /bead/index.html;
#    }
#
#    其余 location /assets/、/models/、/ort/ 也要加 /bead/ 前缀，
#    或整体放进 location /bead/ 内。
#
# ── HTTPS ───────────────────────────────────────────────────────────
# 推荐用 certbot 自动改写：
#   certbot --nginx -d example.com
# 手写时 nginx 1.25.1+ 使用：
#   listen 443 ssl;
#   http2 on;
#   ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
#   ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
# 并保留上面的 COOP/COEP —— 反向代理/CDN 不得剥离这两个响应头。
